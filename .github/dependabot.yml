# Dependabot retune 2026-09-10: version-update PRs are OFF (open-pull-requests-limit: 0).
# Dependabot SECURITY updates still run; they are a repo setting, not this file.
# To re-enable version bumps, raise the limit.
version: 2
updates:
- package-ecosystem: pip
  directory: /backend
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
- package-ecosystem: bun
  directory: /frontend
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
