name: Sync Bun Lockfile

on:
  pull_request_target:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/bun.lock"
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-bun-lockfile:
    if: github.actor == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/frontend/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh bun.lock without running scripts
        working-directory: frontend
        run: bun install --lockfile-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- frontend/bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bun.lock
          git commit -m "chore(ci): refresh bun.lock for Dependabot"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
